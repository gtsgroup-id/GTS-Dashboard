<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Tama Solusi | General Procurement Contractor &amp; Supply</title>
<meta name="description" content="PT Global Tama Solusi: General Procurement Contractor &amp; Supply. Layanan Procurement and Supply serta Event Organizer untuk sektor pemerintahan dan swasta. Surabaya, Jawa Timur.">
<link rel="icon" href="img/logo.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0f2a3a; --teal:#0e7c86; --bg:#eef2f5; --surface:#fff; --ink:#14232d; --muted:#5f7280; --line:#dbe3e8;
          --soft:#e3f1f3; --neg:#b3261e; --ong:#d98e04; --com:#1f8a5b; --pra:#5b7fa6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 'IBM Plex Sans', system-ui, sans-serif; }
  button { font:inherit; cursor:pointer; color:inherit; }
  :focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
  .mono { font-family:'IBM Plex Mono', ui-monospace, monospace; font-size:12.5px; }

  header { background:linear-gradient(120deg, #0b2230 0%, var(--navy) 55%, #123f4d 100%); color:#fff; padding:14px 28px;
           display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:3px solid var(--teal); }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:38px; height:38px; border-radius:9px; background:var(--teal); display:grid; place-items:center; flex:none; }
  .brand h1 { margin:0; font-size:19px; font-weight:700; letter-spacing:.01em; line-height:1.2; }
  .by { display:block; font-size:11px; color:#9fb9c6; letter-spacing:.05em; margin-top:1px; }
  header .meta { display:flex; align-items:center; gap:12px; font-size:12.5px; color:#b9cdd7; }
  .btn { border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); color:#fff; padding:6px 14px; border-radius:6px; font-weight:500; }
  .btn:hover { background:rgba(255,255,255,.18); }

  .layout { display:grid; grid-template-columns:310px minmax(0,1fr); gap:20px; padding:22px 28px; align-items:start; max-width:1500px; margin:0 auto; }
  aside { background:var(--surface); border:1px solid var(--line); border-radius:10px; position:sticky; top:84px; max-height:calc(100vh - 170px); display:flex; flex-direction:column; overflow:hidden; }
  aside input { margin:12px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; background:var(--bg); }
  #list { overflow-y:auto; border-top:1px solid var(--line); }
  .grp { padding:7px 14px; background:var(--bg); color:var(--muted); font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
         border-bottom:1px solid var(--line); position:sticky; top:0; display:flex; align-items:center; gap:8px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
  .item { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); background:none; padding:10px 14px; }
  .item:hover { background:var(--bg); }
  .item.active { background:var(--soft); box-shadow:inset 3px 0 0 var(--teal); }
  .item .nm { display:block; font-weight:500; font-size:13.5px; line-height:1.35; }
  .item .sub { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:3px; color:var(--muted); font-size:12.5px; }
  .item .sub b { font-weight:500; font-variant-numeric:tabular-nums; color:var(--ink); }

  main { min-width:0; }
  .title { margin-bottom:6px; }
  .title h2 { margin:0; font-size:22px; font-weight:700; line-height:1.3; }
  .title p { margin:4px 0 0; color:var(--muted); }
  .pill { display:inline-block; padding:1px 10px; border-radius:999px; font-size:12px; font-weight:600; color:#fff; vertical-align:middle; }
  .sec { margin-top:28px; }
  .sec-h { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .sec-h h3 { margin:0; font-size:17px; font-weight:700; }
  .count { background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:0 10px; font-size:12px; color:var(--muted); }
  .sec-grid { display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:14px; align-items:stretch; margin-bottom:14px; }
  .sec-grid.one { grid-template-columns:minmax(0,1fr); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(205px, 1fr)); gap:12px; align-content:start; }
  .kpi { background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--c, var(--teal)); border-radius:10px; padding:12px 16px 14px; }
  .kpi .lb { color:var(--muted); font-size:12px; font-weight:500; letter-spacing:.03em; }
  .kpi .vl { overflow-wrap:anywhere; font-size:17px; font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums; line-height:1.25; }
  .neg { color:var(--neg); }
  .note { color:var(--muted); font-size:13px; margin:12px 0 0; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-top:14px; }
  .panel > h3, .toolbar h3 { margin:0 0 4px; font-size:15px; font-weight:700; }
  .hint { color:var(--muted); font-size:12.5px; margin:0 0 12px; }

  .donut { display:flex; align-items:center; gap:14px; padding:14px 16px; min-width:0; }
  .donut svg { flex:none; width:136px; height:136px; }
  .slice { cursor:default; transition:opacity .15s; }
  [data-kat].slice { cursor:pointer; }
  .legend { flex:1; min-width:0; display:grid; gap:2px; }
  .lg { display:grid; grid-template-columns:12px minmax(0,1fr) auto; gap:10px; align-items:center; padding:6px 8px; border-radius:6px; border:0; background:none; text-align:left; width:100%; font-size:13px; }
  .tx { display:flex; flex-direction:column; min-width:0; }
  .lg .t { font-weight:500; overflow-wrap:anywhere; line-height:1.3; }
  .lg .v { color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  button.lg:hover { background:var(--bg); }
  button.lg.active { background:var(--soft); box-shadow:inset 3px 0 0 var(--teal); }
  .sw { width:11px; height:11px; border-radius:3px; }
  .lg .p { text-align:right; font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .detail-donut { display:grid; grid-template-columns:auto minmax(0,1fr); gap:28px; align-items:center; }
  .detail-donut svg { width:200px; height:200px; }
  .detail-donut .lg { font-size:13.5px; padding:7px 10px; }
  .card-empty { background:var(--surface); border:1px dashed var(--line); border-radius:10px; display:grid; place-items:center; color:var(--muted); padding:20px; }

  .toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  select { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  .scroll { overflow-x:auto; }
  .tbl { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px 4px 0; }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child td { border-bottom:0; }
  th { color:var(--muted); font-weight:600; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }
  td.num, th.num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  td.nm { font-weight:500; min-width:230px; }
  td.cu { color:var(--muted); font-size:13px; min-width:190px; max-width:260px; }
  td.go { width:24px; color:var(--teal); font-size:18px; line-height:1; text-align:right; padding-left:0; }
  tr.click { cursor:pointer; }
  tr.click:hover { background:var(--soft); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:var(--bg); border-radius:999px; padding:4px 12px; font-size:12.5px; }
  .chip:hover { background:var(--soft); }
  .empty { color:var(--muted); padding:22px 0; text-align:center; }

  .link { margin-left:auto; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:3px 14px; font-size:12.5px; font-weight:600; color:var(--teal); }
  .link:hover { background:var(--soft); }
  .back { border:0; background:none; color:var(--teal); font-weight:600; padding:0; margin-bottom:10px; }
  .back:hover { text-decoration:underline; }
  .phero { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1fr); gap:28px; align-items:center; margin-top:18px; padding:22px 26px;
          border-radius:12px; color:#fff; background:linear-gradient(120deg, #0b2230 0%, #0f2a3a 55%, #14505c 100%); }
  .hero-lb { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#9fb9c6; font-weight:600; }
  .hero-vl { font-size:clamp(22px, 2.6vw, 30px); font-weight:700; margin:4px 0 2px; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; line-height:1.2; }
  .hero-sub { color:#b9cdd7; font-size:13px; }
  .stack { display:flex; height:12px; border-radius:6px; overflow:hidden; background:rgba(255,255,255,.15); }
  .split-lg { display:grid; gap:8px; margin-top:12px; }
  .split-lg > div { display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:8px; align-items:baseline; font-size:13px; }
  .split-lg .v { color:#b9cdd7; font-size:12.5px; display:block; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
  .split-lg b { font-weight:700; }
  .stats { display:grid; gap:12px; }
  .stats .st { border-left:2px solid rgba(255,255,255,.25); padding-left:12px; min-width:0; }
  .stats .st span { display:block; font-size:12px; color:#9fb9c6; }
  .stats .st b { display:block; font-size:15px; font-weight:700; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
  .stats .st small { display:block; font-size:12px; color:#b9cdd7; overflow-wrap:anywhere; }
  .who { display:flex; align-items:center; gap:8px; color:#fff; font-weight:500; }
  .who .pill { background:rgba(255,255,255,.18); font-weight:600; }
  .modal { position:fixed; inset:0; background:rgba(8,24,34,.55); display:grid; place-items:center; z-index:50; padding:16px; }
  .modal[hidden] { display:none; }
  .box { background:var(--surface); border-radius:12px; padding:22px 24px; width:100%; max-width:380px; display:grid; gap:12px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .box h3 { margin:0; font-size:18px; }
  .box label { display:grid; gap:4px; font-size:12.5px; font-weight:600; color:var(--muted); }
  .box input { font:inherit; padding:9px 12px; border:1px solid var(--line); border-radius:8px; color:var(--ink); }
  .lerr { color:var(--neg); font-size:13px; min-height:18px; }
  .row { display:flex; justify-content:flex-end; gap:10px; }
  .b1 { background:var(--teal); color:#fff; border:0; border-radius:8px; padding:8px 18px; font-weight:600; }
  .b2 { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 16px; }
  .locked { border-style:dashed; text-align:center; padding:26px 18px; }
  .locked h3 { margin-bottom:6px; }
  @media (max-width:1250px) { .sec-grid { grid-template-columns:1fr; } .phero { grid-template-columns:1fr; gap:18px; } }
  @media (max-width:1100px) { .sec-grid { grid-template-columns:1fr; } }
  @media (max-width:860px) {
    header { padding:12px 16px; flex-wrap:wrap; }
    .layout { grid-template-columns:1fr; padding:14px; }
    aside { position:static; max-height:300px; }
    .detail-donut { grid-template-columns:1fr; justify-items:center; }
    .detail-donut .legend { width:100%; }
  }

  /* ===== Situs publik ===== */
  header.site { position:sticky; top:0; z-index:30; }
  header.site .brand { cursor:pointer; }
  header.site .brand h1 { font-size:19px; }
  nav#nav { display:flex; align-items:center; gap:4px; }
  nav .nv { background:none; border:0; color:#cfe0e8; padding:8px 14px; border-radius:8px; font-weight:500; font-size:14.5px; }
  nav .nv:hover, nav .nv.on { color:#fff; background:rgba(255,255,255,.12); }
  nav .nv.cta { border:1px solid rgba(255,255,255,.4); margin-left:8px; color:#fff; }
  .dd { position:relative; }
  .ddm { position:absolute; top:100%; left:0; min-width:200px; background:var(--surface); border-radius:10px; box-shadow:0 12px 30px rgba(0,0,0,.22); padding:6px; display:none; }
  .dd:hover .ddm, .dd:focus-within .ddm { display:grid; }
  .ddm button { text-align:left; background:none; border:0; padding:9px 12px; border-radius:6px; font-weight:500; color:var(--ink); }
  .ddm button:hover { background:var(--soft); }
  .burger { display:none; background:none; border:1px solid rgba(255,255,255,.35); border-radius:8px; padding:6px 8px; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 28px; }
  .eyebrow { display:block; text-transform:uppercase; letter-spacing:.14em; font-size:12px; color:#2a8f9b; font-weight:700; }
  .hero { color:#fff; padding:84px 0 84px; background:radial-gradient(1000px 380px at 88% -10%, #1c7a88 0%, transparent 62%), linear-gradient(120deg, #0b2230 0%, #0f2a3a 60%, #12404c 100%); }
  .hero .eyebrow { color:#7fd1d9; }
  .hero h1 { font-size:clamp(38px, 6.2vw, 68px); margin:10px 0 18px; line-height:1.04; letter-spacing:-.02em; }
  .ph { border:1px dashed rgba(255,255,255,.35); border-radius:10px; padding:14px 18px; color:#b9cdd7; max-width:600px; margin:0 0 26px; }
  .hero-cta { display:flex; flex-wrap:wrap; gap:12px; }
  .big { padding:12px 26px; border-radius:10px; font-size:15px; }
  .ghost { border:1px solid rgba(255,255,255,.45); background:none; color:#fff; border-radius:10px; padding:12px 24px; font-weight:500; }
  .ghost:hover { background:rgba(255,255,255,.12); }
  .pb-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; margin-top:-40px; position:relative; }
  .pb-stat { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px 22px; box-shadow:0 8px 24px rgba(15,42,58,.08); }
  .pb-stat b { display:block; font-size:34px; line-height:1.1; color:var(--navy); }
  .pb-stat span { color:var(--muted); font-size:13.5px; }
  .pb-blocks { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; margin:28px 0 56px; }
  .pb-ph { border:2px dashed var(--line); border-radius:12px; padding:26px 24px; background:rgba(255,255,255,.6); color:var(--muted); margin-top:28px; }
  .pb-blocks .pb-ph { margin-top:0; min-height:150px; }
  .pb-ph h3 { margin:0 0 6px; color:var(--ink); font-size:17px; }
  .pb-ph p { margin:0; }
  .pb-head { background:var(--surface); border-bottom:1px solid var(--line); padding:38px 0 0; }
  .pb-head h2 { margin:6px 0 6px; font-size:clamp(26px, 3.6vw, 36px); letter-spacing:-.01em; }
  .pb-head p { margin:0 0 22px; color:var(--muted); max-width:640px; }
  .pb-sub { display:flex; gap:6px; flex-wrap:wrap; }
  .pb-sub button { background:none; border:0; border-bottom:3px solid transparent; padding:10px 16px; font-weight:600; color:var(--muted); }
  .pb-sub button:hover { color:var(--ink); }
  .pb-sub button.on { color:var(--teal); border-bottom-color:var(--teal); }
  .pb-bar { display:grid; grid-template-columns:minmax(0,1fr) repeat(3, auto); gap:10px; margin:26px 0 12px; }
  .pb-bar input { font:inherit; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface); min-width:0; }
  .pb-bar select { padding:10px 12px; border-radius:10px; }
  .pb-count { color:var(--muted); font-size:13.5px; margin:14px 0 14px; }
  .pb-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:26px 0 0; }
  .pb-tabs button { background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:8px 20px; font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px; }
  .pb-tabs button small { background:var(--bg); border-radius:999px; padding:0 8px; font-size:12px; color:var(--muted); }
  .pb-tabs button.on { background:var(--navy); color:#fff; border-color:var(--navy); }
  .pb-tabs button.on small { background:rgba(255,255,255,.2); color:#fff; }
  .pb-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:16px; margin-bottom:48px; }
  .pb-card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 20px 20px; transition:box-shadow .15s, transform .15s; display:flex; flex-direction:column; gap:8px; }
  .pb-card:hover { box-shadow:0 10px 26px rgba(15,42,58,.1); transform:translateY(-2px); }
  .pb-card h3 { margin:0; font-size:16.5px; line-height:1.35; }
  .pb-card p { margin:0; color:var(--muted); font-size:13.5px; line-height:1.45; }
  .pb-meta { display:flex; justify-content:space-between; align-items:center; }
  .pb-y { font-weight:700; font-size:12.5px; color:var(--teal); letter-spacing:.06em; }
  .pb-st { font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; }
  .pb-st.done { background:#e1f3ea; color:#176a45; }
  .pb-st.run { background:#fdf0d2; color:#8a5a00; }
  .pb-empty { border:2px dashed var(--line); border-radius:12px; padding:46px 20px; text-align:center; color:var(--muted); margin-bottom:48px; }
  .pb-empty h3 { margin:0 0 4px; color:var(--ink); }
  .pb-clients { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:14px; margin:26px 0 10px; }
  .pb-client { text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; gap:4px; }
  .pb-client:hover { border-color:var(--teal); }
  .pb-client.on { border-color:var(--teal); box-shadow:inset 3px 0 0 var(--teal); background:var(--soft); }
  .pb-client strong { font-size:15px; line-height:1.35; }
  .pb-client span { color:var(--ink); font-size:13.5px; }
  .pb-client em { color:var(--muted); font-size:12.5px; font-style:normal; }
  .pb-sec { margin:30px 0 14px; font-size:18px; scroll-margin-top:90px; }
  .foot { border-top:1px solid var(--line); padding:22px 0; color:var(--muted); font-size:13px; background:var(--surface); margin-top:24px; }
  .pbar { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 28px; background:var(--surface); border-bottom:1px solid var(--line); }
  .pbar .pmuted { color:var(--muted); }
  .pbar .meta { display:flex; align-items:center; gap:12px; font-size:12.5px; color:var(--muted); }
  .pbar .btn { border-color:var(--line); background:var(--surface); color:var(--ink); }
  .pbar .btn:hover { background:var(--soft); }
  .pbar .who { color:var(--ink); }
  .pbar .who .pill { background:var(--soft); color:var(--navy); }
  .gate .layout { grid-template-columns:minmax(0, 560px); justify-content:center; }
  .gate aside { display:none; }
  [hidden] { display:none !important; }
  @media (max-width:860px) {
    header.site { flex-wrap:wrap; padding:12px 16px; }
    .burger { display:block; }
    nav#nav { display:none; width:100%; flex-direction:column; align-items:stretch; padding-top:8px; }
    nav#nav.open { display:flex; }
    nav .nv.cta { margin-left:0; text-align:left; }
    .dd .ddm { display:grid; position:static; box-shadow:none; background:rgba(255,255,255,.06); margin:0 0 0 12px; }
    .ddm button { color:#cfe0e8; }
    .ddm button:hover { background:rgba(255,255,255,.12); }
    .wrap { padding:0 18px; }
    .hero { padding:56px 0 64px; }
    .pb-bar { grid-template-columns:1fr 1fr; }
    .pb-bar input { grid-column:1 / -1; }
    .pbar { padding:12px 16px; }
  }

  /* ===== Halaman perusahaan ===== */
  .logo.img { background:none; width:auto; height:auto; border-radius:0; }
  .logo.img img { height:38px; display:block; }
  nav .nv { padding:8px 11px; font-size:14px; }
  .hero { background-size:cover; background-position:center; padding:76px 0 92px; }
  .hero-logo { height:74px; display:block; margin-bottom:18px; }
  .hero-tag { font-size:clamp(17px, 2.2vw, 22px); color:#cfe0e8; margin:0 0 28px; font-weight:500; }
  .pb-body { padding-top:30px; padding-bottom:56px; }
  .pb-head.nt { padding-bottom:26px; }
  .pb-two { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:34px; align-items:start; }
  .pb-two.rev { grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr); }

      '<select id="ast" aria-label="Status"><option value="">Semua status</option><option' + (AST === 'Selesai' ? ' selected' : '') + '>Selesai</option><option' + (AST === 'Berjalan' ? ' selected' : '') + '>Berjalan</option></select>' +
      '<select id="ayr" aria-label="Tahun"><option value="">Semua tahun</option>' + ys.map(function (y) { return '<option' + (AY === String(y) ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select>' +
      '<select id="aso" aria-label="Urutan provinsi"><option value="jumlah"' + (ASORT === 'jumlah' ? ' selected' : '') + '>Provinsi: terbanyak</option><option value="berjalan"' + (ASORT === 'berjalan' ? ' selected' : '') + '>Provinsi: berjalan dahulu</option><option value="abjad"' + (ASORT === 'abjad' ? ' selected' : '') + '>Provinsi: A-Z</option></select>' +
      '<div class="ar-btns"><button class="b2 sm" data-aexp="1">Buka semua</button><button class="b2 sm" data-aexp="0">Tutup semua</button></div></div>';
    setPub(pageHead('Project', 'Our Projects', 'Project yang telah dan sedang kami kerjakan. Pilih pulau, lalu buka provinsi untuk melihat rinciannya. Project berjalan ditampilkan paling atas, diikuti tahun terbaru.') +
      '<div class="wrap">' + tiles + tool + '<div id="arres">' + areaResults() + '</div></div>');
    $('aq').oninput = function () { AQ = this.value; updateArea(); };
    $('ast').onchange = function () { AST = this.value; updateArea(); };
    $('ayr').onchange = function () { AY = this.value; updateArea(); };
    $('aso').onchange = function () { ASORT = this.value; updateArea(); };
  }
  function openLargest(pl) {
    var c = {};
    PUB.forEach(function (p) { if (p.pulau === pl) c[p.provinsi] = (c[p.provinsi] || 0) + 1; });
    var top = Object.keys(c).sort(function (a, b) { return c[b] - c[a]; })[0];
    if (top) AOPEN[top] = true;
  }

  function siteClick(e) {
    var t = e.target.closest('[data-p]');
    if (t) { go(t.getAttribute('data-p')); return; }
    t = e.target.closest('[data-ar]');
    if (t) { ASEL = t.getAttribute('data-ar'); AOPEN = {}; ASHOW = {}; if (ASEL) openLargest(ASEL); renderPage(); return; }
    t = e.target.closest('[data-ap]');
    if (t) { var pv = t.getAttribute('data-ap'); AOPEN[pv] = !isOpen(pv); updateArea(); return; }
    t = e.target.closest('[data-am]');
    if (t) { var pm = t.getAttribute('data-am'); ASHOW[pm] = (ASHOW[pm] || 12) + 24; updateArea(); return; }
    t = e.target.closest('[data-aexp]');
    if (t) {
      var o = t.getAttribute('data-aexp') === '1', g = areaGroups();
      Object.keys(g).forEach(function (pl) { Object.keys(g[pl]).forEach(function (k) { AOPEN[k] = o; }); });
      updateArea();
    }
  }
  function initSite() {
    if (IMG.logoW) { $('brandlogo').innerHTML = '<img src="' + IMG.logoW + '" alt="GTS">'; $('brandlogo').classList.add('img'); }
    $('portalLink').href = API_URL + '?page=portal';
    $('hdr').addEventListener('click', siteClick);
    $('site').addEventListener('click', siteClick);
    $('ftr').addEventListener('click', siteClick);
    $('burger').addEventListener('click', function () {
      var n = $('nav'), o = !n.classList.contains('open');
      n.classList.toggle('open', o); this.setAttribute('aria-expanded', String(o));
    });
    window.addEventListener('hashchange', function () { show(routeFromHash()); });
    show(routeFromHash());
  }
  initSite();
</script>
</body>
</html>
